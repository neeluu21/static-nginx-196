
name: Deploy Static Website to Nginx

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy website to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu
          install -m 600 /dev/null deploy_key
          printf '%s\n' "$EC2_SSH_KEY" > deploy_key
          trap 'rm -f deploy_key' EXIT

          ssh -i deploy_key \
            -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" \
            'sudo mkdir -p /var/www/html &&
             sudo chown -R ubuntu:ubuntu /var/www/html'

          scp -i deploy_key \
            -o StrictHostKeyChecking=accept-new \
            index.html "$EC2_USER@$EC2_HOST:/tmp/index.html"

          ssh -i deploy_key \
            -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" \
            'sudo install -m 644 /tmp/index.html /var/www/html/index.html &&
             rm -f /tmp/index.html &&
             sudo systemctl reload nginx'
